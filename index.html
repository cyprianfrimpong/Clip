<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clip</title>
<style>
:root{--bg:#faf7ff;--card:#fff;--tx:#1b1530;--mu:#756b92;--ln:#e4dcf5;--pk:#ff2d6f;--cy:#12b8ab;--gold:#e8a200;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120d1c;--card:#1e1730;--tx:#f6f2ff;--mu:#9c92b8;--ln:#33294d;--cy:#2ee6d6;--gold:#ffc83d}}
:root[data-theme="dark"]{--bg:#120d1c;--card:#1e1730;--tx:#f6f2ff;--mu:#9c92b8;--ln:#33294d;--cy:#2ee6d6;--gold:#ffc83d}
html,body{height:100%;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:16px/1.4 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
#app{max-width:460px;height:100%;margin:auto;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;min-height:0}
nav{display:flex;border-top:1px solid var(--ln);background:var(--card)}nav[hidden]{display:none}
nav button{flex:1;padding:12px 0;border:0;background:none;color:var(--mu);font:inherit;font-weight:700;cursor:pointer}
nav button.on{color:var(--pk)}nav .plus{color:#fff;background:var(--pk);border-radius:12px;margin:6px 10px;flex:.7}
button{font:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
.feed{scroll-snap-type:y mandatory;height:100%;overflow-y:auto}
.v{position:relative;height:100%;scroll-snap-align:start;color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.v .em{font-size:110px;filter:drop-shadow(0 8px 20px #0006)}
.meta{position:absolute;left:16px;bottom:20px;right:90px;text-shadow:0 1px 6px #0008}.meta p{margin:4px 0 0}
.rail{position:absolute;right:12px;bottom:20px;display:flex;flex-direction:column;gap:14px}
.rail button{width:56px;height:56px;border-radius:50%;border:0;background:#0005;color:#fff;font-size:22px;line-height:1}
.rail button.on{background:var(--pk)}.rail small{display:block;font-size:11px}
.pad{padding:16px}h2{margin:0 0 10px;font-size:22px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:8px}
.stats b{display:block;font-size:22px}.stats span{color:var(--mu);font-size:13px}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--pk);color:#fff;font-weight:700}
.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--ln)}
.row{display:flex;gap:8px;flex-wrap:wrap}.mu{color:var(--mu);font-size:13px}
input{width:100%;box-sizing:border-box;padding:12px;margin:4px 0 10px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit}
.pick button{font-size:26px;border:2px solid var(--ln);border-radius:10px;background:var(--card);padding:4px 8px}.pick button.on{border-color:var(--pk)}
.sw{width:44px;height:44px;border-radius:10px;border:3px solid transparent}.sw.on{border-color:var(--tx)}
.stage{position:relative;height:100%;color:#fff;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.top{display:flex;justify-content:space-between;padding:12px;gap:8px}
.pill{background:#0007;border-radius:20px;padding:4px 12px;font-weight:700;border:0;color:#fff}
.chat{padding:0 12px;max-height:40%;overflow-y:auto;text-shadow:0 1px 4px #000a}.chat div{margin:3px 0}.chat b{color:#ffd9e6}
.tray{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:#000a;align-items:center}
.tray button{flex:none;border:1px solid #fff4;background:#fff1;color:#fff;border-radius:12px;padding:6px 10px;text-align:center}.tray small{display:block;color:var(--gold)}
.send{display:flex;gap:8px;padding:8px 12px;background:#000a}.send input{margin:0}
.fly{position:absolute;left:50%;bottom:30%;font-size:64px;animation:fly 1.8s ease-out forwards;pointer-events:none}
.fly i{display:block;font:700 14px/1 sans-serif;text-align:center;background:#000a;border-radius:10px;padding:3px 6px}
@keyframes fly{to{transform:translateY(-220px) scale(1.4);opacity:0}}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);background:#000d;color:#fff;border-radius:20px;padding:8px 16px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
@media (prefers-reduced-motion:reduce){.fly{animation-duration:.01s}}
</style></head>
<body><div id="app"><main id="m"></main>
<nav id="nav" hidden><button data-t="feed">Feed</button><button data-t="live">Live</button><button class="plus" data-t="post">+ Post</button><button data-t="me">Me</button></nav></div>
<div id="toast" role="status"></div>
<script>
const API_BASE=''; // '' = same server that served this page. Set e.g. 'https://api.example.com' if hosted separately.
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GR=['linear-gradient(160deg,#ff2d6f,#7a2cff)','linear-gradient(160deg,#2ee6d6,#2c5cff)','linear-gradient(160deg,#ffb23d,#ff2d6f)','linear-gradient(160deg,#3dff9a,#0a7a8a)'];
const EM=['😎','🔥','🐶','🎸','🍜','🏄','💃','🌈'];
const GIFTS={rose:{n:'Rose',e:'🌹',c:1},coffee:{n:'Coffee',e:'☕',c:5},crown:{n:'Crown',e:'👑',c:50},lion:{n:'Lion',e:'🦁',c:299},rocket:{n:'Rocket',e:'🚀',c:500}};
const PACKS=[[70,'$0.99'],[350,'$4.99'],[700,'$9.99']];
let tok=null,tab='feed',L=null,es=null,seq=0,coins=0,draft={e:EM[0],g:0};
try{tok=localStorage.getItem('clip_t')}catch(e){}

async function api(method,path,body){
 const r=await fetch(API_BASE+'/api'+path,{method,headers:{'Content-Type':'application/json',...(tok?{Authorization:'Bearer '+tok}:{})},body:method==='POST'?JSON.stringify(body||{}):undefined});
 const j=await r.json().catch(()=>({}));
 if(r.status===401&&tok&&path!=='/login'){logout();throw new Error('Please log in again')}
 if(!r.ok)throw new Error(j.error||'Something went wrong');return j}
function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.opacity=0,2200)}
function logout(){tok=null;try{localStorage.removeItem('clip_t')}catch(e){}closeLive();go('feed')}
function closeLive(){if(es){es.close();es=null}L=null}

function go(t){closeLive();tab=t;$('#nav').hidden=!tok;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));draw()}
async function draw(){
 const m=$('#m'),my=++seq;
 if(!tok){m.innerHTML=`<div class="pad"><h2>Welcome to Clip</h2><div class="card"><label>Username<input id="u" autocomplete="username" maxlength="20"></label>
 <label>Password<input id="p" type="password" autocomplete="current-password"></label><p class="mu">Usernames: 3–20 letters, numbers or _. Passwords: 8+ characters.</p>
 <div class="row"><button class="btn" data-a="login">Log in</button><button class="btn alt" data-a="signup">Create account</button></div></div></div>`;return}
 try{
 if(tab==='feed'){const f=await api('GET','/feed');if(my!==seq)return;
  m.innerHTML=f.length?`<div class="feed">${f.map(v=>`<section class="v" style="background:${GR[v.bg%4]}"><div class="em">${esc(v.emoji)}</div>
  <div class="meta"><b>@${esc(v.by)}</b><p>${esc(v.caption)}</p></div><div class="rail">
  <button data-a="like" data-id="${v.id}" class="${v.liked?'on':''}" aria-label="Like">♥<small>${v.likes}</small></button>
  <button data-a="fol" data-by="${esc(v.by)}" aria-label="Follow">${v.following?'✓':'+'}<small>${v.following?'Following':'Follow'}</small></button></div></section>`).join('')}</div>`
  :`<div class="pad"><h2>Nothing here yet</h2><p>Tap + Post to share the first video.</p></div>`}
 if(tab==='post')m.innerHTML=`<div class="pad"><h2>Post a video</h2><div class="card"><label>Caption<input id="cap" maxlength="60" placeholder="What’s happening?"></label>
  <p>Pick a clip</p><div class="row pick">${EM.map(e=>`<button data-a="em" data-v="${e}" class="${draft.e===e?'on':''}">${e}</button>`).join('')}</div>
  <p>Pick a background</p><div class="row">${GR.map((g,i)=>`<button class="sw ${draft.g===i?'on':''}" data-a="bg" data-v="${i}" style="background:${g}" aria-label="Background ${i+1}"></button>`).join('')}</div>
  <p><button class="btn" data-a="post">Publish video</button></p></div></div>`;
 if(tab==='live'){const ls=await api('GET','/live');if(my!==seq)return;
  m.innerHTML=`<div class="pad"><h2>Live</h2><div class="card"><b>Go live</b><p>Start a stream. Viewers can chat and send gifts that turn into diamonds.</p><button class="btn" data-a="host">Go live</button></div>
  <div class="card"><b>Live now</b>${ls.length?ls.map(l=>`<p>@${esc(l.host)} · 👁 ${l.viewers} <button class="btn alt" data-a="watch" data-id="${l.live_id}" data-host="${esc(l.host)}">Watch</button></p>`).join(''):'<p class="mu">No one is live right now. Be the first.</p>'}
  <button class="btn alt" data-a="refresh">Refresh</button></div></div>`}
 if(tab==='me'){const p=await api('GET','/me');if(my!==seq)return;coins=p.coins;
  m.innerHTML=`<div class="pad"><h2>@${esc(p.username)}</h2><div class="card stats"><div><b>${p.followers}</b><span>Followers</span></div><div><b>${p.following}</b><span>Following</span></div><div><b>${p.likes}</b><span>Likes</span></div></div>
  <div class="card"><b>Wallet</b><p>🪙 ${p.coins} coins · 💎 ${p.diamonds} diamonds</p><div class="row">${PACKS.map(k=>`<button class="btn alt" data-a="buy" data-c="${k[0]}">🪙 ${k[0]} · ${k[1]}</button>`).join('')}</div>
  <p class="mu">2 diamonds = 1 cent when you cash out.</p><button class="btn" data-a="cash">Cash out diamonds</button></div>
  <div class="card"><b>My videos</b>${p.videos.map(v=>`<p>${esc(v.emoji)} ${esc(v.caption)} · ♥ ${v.likes}</p>`).join('')||'<p class="mu">No videos yet. Tap + Post to share your first one.</p>'}</div>
  <button class="btn alt" data-a="logout">Log out</button></div>`}
 }catch(e){if(my===seq){m.innerHTML=`<div class="pad"><h2>Can’t load this</h2><p>${esc(e.message)}</p><button class="btn" data-a="retry">Try again</button></div>`}}
}

function say(n,t){const c=$('#chat');if(!c)return;c.insertAdjacentHTML('beforeend',`<div><b>${esc(n)}</b> ${esc(t)}</div>`);c.scrollTop=c.scrollHeight}
function fly(e,l){const s=$('.stage');if(!s)return;const d=document.createElement('div');d.className='fly';d.style.marginLeft=(Math.random()*120-60)+'px';d.innerHTML=e+'<i>'+esc(l)+'</i>';s.appendChild(d);setTimeout(()=>d.remove(),1900)}
function openStage(mode,id,host){
 closeLive();seq++;L={mode,id,earned:0};
 $('#m').innerHTML=`<div class="stage" style="background:${GR[mode==='host'?0:1]}"><div class="top"><span class="pill">🔴 ${mode==='host'?'You are live':'@'+esc(host)}</span><span class="pill">👁 <span id="vw">0</span></span><button class="pill" data-a="end">${mode==='host'?'End':'Leave'}</button></div>
 <div class="chat" id="chat" aria-live="polite"></div>
 ${mode==='host'?'<div class="tray">💎 <b id="ea">0</b> earned this stream</div>':`<div class="tray">${Object.entries(GIFTS).map(([k,g])=>`<button data-a="gift" data-g="${k}">${g.e}<br>${g.n}<small>🪙 ${g.c}</small></button>`).join('')}</div>`}
 <div class="send"><input id="ci" maxlength="140" placeholder="Say something" aria-label="Chat message"><button class="btn" data-a="chat">Send</button></div></div>`;
 es=new EventSource(API_BASE+'/api/live/'+id+'/stream');
 const on=(n,f)=>es.addEventListener(n,e=>f(JSON.parse(e.data)));
 on('chat',d=>say(d.user,d.text));
 on('gift',d=>{const g=GIFTS[d.gift]||{e:'🎁',n:d.gift};say(d.user,'sent '+g.e+' '+g.n);fly(g.e,d.user);if(L&&L.mode==='host'){L.earned+=d.coins;$('#ea').textContent=L.earned}});
 on('viewers',d=>{const e=$('#vw');if(e)e.textContent=L&&L.mode==='host'?Math.max(0,d.count-1):d.count});
 on('end',()=>{if(L&&L.mode==='watch'){toast('The stream ended');go('live')}});
 es.onerror=()=>{if(es&&es.readyState===2){toast('Connection lost');go('live')}};
 say('system',mode==='host'?'You are live. Say hi!':'Joined @'+host+'’s stream')}

document.addEventListener('click',async ev=>{
 const n=ev.target.closest('nav button');if(n)return go(n.dataset.t);
 const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,d=b.dataset;
 try{
 if(a==='login'||a==='signup'){const r=await api('POST','/'+a,{username:$('#u').value,password:$('#p').value});tok=r.token;try{localStorage.setItem('clip_t',tok)}catch(e){}toast('Welcome, @'+r.username);go('feed')}
 if(a==='retry'||a==='refresh')draw();
 if(a==='logout')logout();
 if(a==='like'){const r=await api('POST','/videos/'+d.id+'/like');b.classList.toggle('on',r.liked);b.querySelector('small').textContent=r.likes}
 if(a==='fol'){const r=await api('POST','/users/'+d.by+'/follow');
  document.querySelectorAll('[data-a="fol"]').forEach(x=>{if(x.dataset.by===d.by)x.innerHTML=(r.following?'✓':'+')+'<small>'+(r.following?'Following':'Follow')+'</small>'});
  toast((r.following?'Following @':'Unfollowed @')+d.by)}
 if(a==='em'||a==='bg'){const c=$('#cap').value;if(a==='em')draft.e=d.v;else draft.g=+d.v;draw();setTimeout(()=>{$('#cap').value=c},0)}
 if(a==='post'){await api('POST','/videos',{caption:$('#cap').value,emoji:draft.e,bg:draft.g});toast('Posted!');go('feed')}
 if(a==='host'){const r=await api('POST','/live/start');openStage('host',r.live_id)}
 if(a==='watch'){coins=(await api('GET','/me')).coins;openStage('watch',d.id,d.host)}
 if(a==='end'){if(L&&L.mode==='host'){const r=await api('POST','/live/'+L.id+'/end');closeLive();toast('Stream ended. You earned 💎 '+r.earned_diamonds)}else closeLive();go('live')}
 if(a==='chat'){const i=$('#ci'),t=i.value.trim();if(t){i.value='';await api('POST','/live/'+L.id+'/chat',{text:t})}}
 if(a==='gift'){const r=await api('POST','/live/'+L.id+'/gift',{gift:d.g});coins=r.coins;toast('Sent '+GIFTS[d.g].n+' · 🪙 '+coins+' left')}
 if(a==='buy'){await api('POST','/wallet/buy',{coins:+d.c});toast('Added '+d.c+' coins');draw()}
 if(a==='cash'){const r=await api('POST','/wallet/cashout');toast('Cashed out 💎 '+r.diamonds+' ≈ $'+r.usd.toFixed(2));draw()}
 }catch(e){toast(e.message)}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ci')document.querySelector('[data-a="chat"]').click();
 if(e.key==='Enter'&&(e.target.id==='u'||e.target.id==='p'))document.querySelector('[data-a="login"]').click()});
go('feed');
</script></body></html>
